[global]
# Visningsnavn i Spotify Connect
device_name = "Josefine"
device_type = "speaker"

# Lyd-backend via PipeWire-Pulse
backend = "pulseaudio"
volume_controller = "softvol"
initial_volume = "75"
bitrate = 320

# Aktiver MPRIS (D-Bus) slik at Quickshell-spilleren øverst i Josefine-panelet
# automatisk viser sangtittel, cover-bilde og styrer Play/Pause/Neste/Forrige!
use_mpris = true

# ZeroConf (mDNS) så man kan logge inn første gang ved å velge "Josefine"
# fra Spotify-appen på mobilen på samme Wi-Fi
zeroconf_port = 57621
cache_path = "/tmp/spotifyd-cache"
no_audio_cache = false
volume_normalisation = true
normalisation_pregain = -6
